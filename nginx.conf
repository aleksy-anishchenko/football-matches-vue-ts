server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass https://api.football-data.org/;
    proxy_set_header Host api.football-data.org;

    proxy_ssl_server_name on;

    proxy_set_header X-Auth-Token $http_x_auth_token;
  }
}